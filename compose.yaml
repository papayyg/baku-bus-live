name: baku-bus-live

services:
    app:
        build: .
        restart: unless-stopped
        env_file: .env
        environment:
            HOST: 0.0.0.0
            PORT: "8080"
            DATA_DIR: /data
            DEV_USER_ID: ""
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:8080"
        volumes:
            - app-data:/data
        read_only: true
        tmpfs: [/tmp]
        cap_drop: [ALL]
        security_opt: [no-new-privileges:true]
        mem_limit: 384m
        pids_limit: 128
        init: true
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 30s
            timeout: 8s
            start_period: 60s
            retries: 3
        logging:
            driver: json-file
            options: { max-size: "10m", max-file: "3" }

volumes:
    app-data:
